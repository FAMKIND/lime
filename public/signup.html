<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up — Lime</title>
  <!-- LIME-48: signup.html is now a redirect, not a real page — the
       email-first flow lives in auth.html. Redirects straight to the
       create step (?step=create), preserving the rest of the query
       string (e.g. a future ?email=… prefill) — auth.html's own script
       reads ?step=create to skip the "does this email already have an
       account" branch entirely, since arriving here is an explicit
       "I want to sign up" signal. Kept as a real file for the same
       reason login.html is: an old link or bookmark should keep working. -->
  <script>
    var params = new URLSearchParams(window.location.search);
    params.set('step', 'create');
    window.location.replace('auth.html?' + params.toString());
  </script>
</head>
<body>
  <noscript><a href="auth.html?step=create">Continue to sign up</a></noscript>
</body>
</html>
