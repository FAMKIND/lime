<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Lime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../vendor/seed/tokens/tokens.css">
  <link rel="stylesheet" href="../vendor/seed/components/button/button.css">
  <link rel="stylesheet" href="../vendor/seed/components/input/input.css">
  <link rel="stylesheet" href="css/lime.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="lime-auth">
    <div class="lime-auth__marketing">
      <div class="lime-auth__marketing-logo">
        <span data-brand-mark aria-hidden="true"><img src="assets/logo-mark.svg" alt=""></span>
        <span data-brand-wordmark aria-hidden="true"><img src="assets/logo-wordmark.svg" alt=""></span>
      </div>
      <p class="lime-auth__tagline">Connect families and teachers, effortlessly.</p>
      <div class="lime-auth__illustration" role="img" aria-label="Illustration placeholder"></div>
    </div>

    <div class="lime-auth__form">
      <div class="lime-auth__toggle">
        Already have an account? <a href="login.html">Log in</a>
      </div>

      <div class="lime-auth__form-inner">
        <div class="lime-auth__form-logo">
          <span data-brand-mark aria-hidden="true"><img src="assets/logo-mark.svg" alt=""></span>
          <span data-brand-wordmark aria-hidden="true"><img src="assets/logo-wordmark.svg" alt=""></span>
        </div>

        <h1 class="lime-auth__heading">Create your account</h1>

        <div class="lime-auth__error" id="signup-error" role="alert"></div>

        <form id="signup-form">
          <div class="lime-auth__field">
            <label class="seed-label" for="signup-email">Email</label>
            <input class="seed-input" id="signup-email" name="email" type="email" placeholder="you@example.com" required>
          </div>

          <div class="lime-auth__field">
            <label class="seed-label" for="signup-password">Password</label>
            <input class="seed-input" id="signup-password" name="password" type="password" placeholder="At least 8 characters" minlength="8" required>
          </div>

          <div class="lime-auth__field">
            <label class="seed-label" for="signup-name">Display name</label>
            <input class="seed-input" id="signup-name" name="displayName" type="text" placeholder="Jean Chung" required>
          </div>

          <label class="lime-auth__terms">
            <input class="seed-checkbox" type="checkbox" id="signup-terms" required>
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
          </label>

          <button type="submit" class="seed-button seed-button--primary seed-button--md lime-auth__submit">Create account</button>
        </form>

        <div class="lime-auth__divider"><span>or</span></div>

        <a class="lime-auth__alt" href="#" title="Not available yet">Use phone number instead</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('signup-error');
      errorEl.classList.remove('is-visible');
      errorEl.textContent = '';

      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const displayName = document.getElementById('signup-name').value;

      try {
        await signUp(email, password, displayName);
        window.location.href = 'index.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Something went wrong. Please try again.';
        errorEl.classList.add('is-visible');
      }
    });
  </script>
</body>
</html>
