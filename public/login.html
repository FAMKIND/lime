<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In — Lime</title>
  <!-- LIME-48: login.html is now a redirect, not a real page — the
       email-first flow lives in auth.html, which handles both an
       existing account and a new one from a single email field. Kept as
       a real file (not just removed) because LimeAuth.signOut() and the
       session gate in app.js both still target it directly, and because
       a bookmark or old link to /login.html should keep working.
       Preserves the full query string — the gate appends
       ?reason=storage|fileorigin (LIME-33-fix) for auth.html to read. -->
  <script>
    window.location.replace('auth.html' + window.location.search);
  </script>
</head>
<body>
  <noscript><a href="auth.html">Continue to sign in</a></noscript>
</body>
</html>
