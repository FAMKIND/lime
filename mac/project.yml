name: LimeMac
options:
  xcodeVersion: "2700"
  bundleIdPrefix: com.famkind
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Mac Catalyst, "Optimize for Mac" (DECISION M-A = B), Apple silicon only, macOS 14+.
    SUPPORTS_MACCATALYST: YES
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    TARGETED_DEVICE_FAMILY: "2,6"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "152.0.0"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: "2.17.0"
targets:
  LimeMac:
    type: application
    platform: iOS
    sources:
      - path: ../ios/Lime
        excludes:
          - "App/LimeApp.swift"
          - "Core/Generated/**"
          - "Config/BackendConfig.generated.swift"
          - "Resources/Sounds/README.md"
          # Patched copies are written by generate.sh into Lime/Generated (TEND-MAC.md "Stand-ins").
          - "Core/Calls/GroupCallManager.swift"
          - "Features/Chat/Composer/ComposerDocument.swift"
      - path: Lime
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - framework: Frameworks/LimeCoreFFI.xcframework
        embed: false
      - sdk: Security.framework
      - package: WebRTC
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.famkind.lime
        PRODUCT_NAME: lime
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/LimeMac.entitlements
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: lime
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "lime shows your most recent photos and videos in the add sheet so you can send them. They stay on this Mac until you send them."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "lime saves a photo to your library only when you ask it to."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "lime turns the speech in a video, recording or voice message into captions or a transcript, on this Mac. Nothing is sent to Apple or anyone else."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "lime uses the microphone to record voice messages and the sound of videos you record."
        INFOPLIST_KEY_NSCameraUsageDescription: "lime uses the camera to scan a teacher's QR code and to take photos and videos to send."
  LimeMacUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LimeMacUITests
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - target: LimeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.famkind.lime.macuitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LimeMac:
    build:
      targets:
        LimeMac: all
    test:
      targets:
        - LimeMacUITests
