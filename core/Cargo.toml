# The mesh engine is a separate crate in the same workspace (it depends on nothing of lime's): `cargo test --workspace` runs both.
[workspace]
members = ["mesh"]

[package]
name = "lime_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "LimeCore: Lime's shared core (encryption today; sync and storage later)."
publish = false

[lib]
name = "lime_core"
crate-type = ["staticlib", "lib"]

[features]
# The integration tests talk to a real Supabase stack (local or staging); see core/README.md.
integration = []
# Only the binding generator binary needs this (see uniffi-bindgen.rs).
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
uniffi = { version = "0.32.2" }
vodozemac = "0.11.1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
uuid = { version = "1.27.0", features = ["v7", "v4"] }
# The OS random source, for the group-call sender keys and ids (LIME-166; already in the build through uuid and vodozemac).
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hkdf = "0.13"
aes-gcm = "0.10"
sha2 = "0.11"
hmac = "0.13"
lime_mesh = { path = "mesh" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

# SQLCipher needs a crypto library: Apple uses CommonCrypto, Android has none, so it builds OpenSSL from source.
[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
