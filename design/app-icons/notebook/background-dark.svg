  <linearGradient id="spine" x1="0" x2="1"><stop offset="0" stop-color="#050706"/><stop offset="0.55" stop-color="#181c1a"/><stop offset="1" stop-color="#0a0d0b"/></linearGradient>
  <filter id="lsh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter></defs>
  <rect width="1024" height="1024" fill="#0a0c0b"/>
