  <g filter="url(#lsh)"><rect x="262" y="206" width="650" height="612" rx="36" fill="#e9e7df"/></g>
  <rect x="284" y="228" width="606" height="568" rx="22" fill="none" stroke="#131b17" stroke-opacity="0.18" stroke-width="3"/>
