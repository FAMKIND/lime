<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lime, a private messenger for teachers</title>
<style>
  :root { --bg: #fbfaf5; --text: #1d2a14; --muted: #5d6b50; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11160d; --text: #f1f5e8; --muted: #a8b59a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); text-align: center;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  main { max-width: 440px; } h1 { font-size: 28px; margin: 0 0 10px; } p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🍋‍🟩 lime</h1>
  <p>A private messenger made for teachers. End-to-end encrypted. The iPhone app is coming soon.</p>

  -->
</main>

</html>
