<main id="main">

    <h1 id="h-join">Where teachers connect.</h1>
    <form class="sub stack" action="https://ddshpgfkjygftkuorrqw.supabase.co/functions/v1/waitlist-join" method="post" data-subscribe>
      <input type="hidden" name="list" value="launch">
      <label class="sr" for="e-join">Email address</label>
      <input id="e-join" type="email" name="email" autocomplete="email" placeholder="Your email" required>
      <button class="btn" type="submit" data-cta aria-label="Notify me when lime is ready">Notify me</button>
      <output class="note" role="status" aria-live="polite"></output>
    </form>
    <p class="fine" data-fine>We'll email you once, when lime is ready. Nothing else.</p>
    <!-- Store badges stay hidden until there is an app to download: set the links in landing.js (the launch switch). -->
    <div class="stores" hidden><a data-store="appStore" href="#">Download on the App Store</a><a data-store="googlePlay" href="#">Get it on Google Play</a></div>

      <input type="hidden" name="list" value="android">
      <label class="sr" for="e-android">Email address</label>
      <input id="e-android" type="email" name="email" autocomplete="email" placeholder="Your email" required>
      <button class="btn" type="submit" aria-label="Notify me when lime is on Android">Notify me when lime is on Android</button>
      <output class="note" role="status" aria-live="polite"></output>
      <p class="fine">We'll email you once, when lime is on Android. Nothing else.</p>
    </form>
  </section>
</main>
