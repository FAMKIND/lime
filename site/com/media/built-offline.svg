<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="t d">
  <title id="t">A message passing between nearby phones</title>
  <desc id="d">Three phones in a row. A sealed envelope travels from the first phone, through the second, to the third, with no signal bars on any of them.</desc>
  <defs>
    <g id="phone"><rect width="96" height="176" rx="20" fill="#131b17"/><rect x="6" y="6" width="84" height="164" rx="15" fill="#f9f8f4"/><rect x="34" y="12" width="28" height="6" rx="3" fill="#131b17"/>
      <path d="M22 132h52M22 146h34" stroke="#cfcbbf" stroke-width="6" stroke-linecap="round"/></g>
    <g id="env"><rect width="44" height="32" rx="7" fill="#fff" stroke="#131b17" stroke-width="3"/><path d="M4 6l18 14 18-14" fill="none" stroke="#131b17" stroke-width="3" stroke-linejoin="round"/><circle cx="22" cy="20" r="5" fill="#a3e18a" stroke="#131b17" stroke-width="2"/></g>
  </defs>
  <path d="M130 150c36-48 64-48 100 0M290 150c36-48 64-48 100 0" fill="none" stroke="#9aa39b" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <use href="#phone" x="24" y="96"/><use href="#phone" x="212" y="96"/><use href="#phone" x="400" y="96"/>
  <use href="#env" x="40" y="116"/><use href="#env" x="228" y="116"/><use href="#env" x="416" y="116"/>
  <g fill="none" stroke="#9aa39b" stroke-width="3" stroke-linecap="round"><path d="M60 78l24 24M84 78L60 102" transform="translate(-4 -48)"/><path d="M248 78l24 24M272 78L248 102" transform="translate(-4 -48)"/><path d="M436 78l24 24M460 78L436 102" transform="translate(-4 -48)"/></g>
  <text x="260" y="332" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="17" fill="#55625a">Sealed. Passed on. Delivered.</text>
</svg>
