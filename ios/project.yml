name: Lime
options:
  bundleIdPrefix: com.famkind
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Lime:
    type: application
    platform: iOS
    sources:
      - path: Lime
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.famkind.lime   # placeholder; confirm before registering with Apple
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lime
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  LimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LimeTests
    dependencies:
      - target: Lime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.famkind.lime.tests
        GENERATE_INFOPLIST_FILE: YES
  LimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LimeUITests
    dependencies:
      - target: Lime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.famkind.lime.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lime:
    build:
      targets:
        Lime: all
    test:
      targets:
        - LimeTests
        - LimeUITests
