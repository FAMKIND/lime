name: Lime
options:
  # Marks the project as checked with Xcode 27, so Xcode does not offer "Update to recommended settings".
  xcodeVersion: "2700"
  bundleIdPrefix: com.famkind
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode 27 recommended setting (generates Swift symbols for String Catalogs; there are none yet).
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # LimeCore is built for the device and the Apple-silicon simulator only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  # Google's WebRTC (BSD-3), prebuilt by a maintained Swift package, for calls (LIME-111).
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "152.0.0"
targets:
  Lime:
    type: application
    platform: iOS
    sources:
      - path: Lime
        excludes:
          - "Resources/Sounds/README.md"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      # LimeCore's static library (core/build-ios.sh builds it; gitignored).
      - framework: Frameworks/LimeCoreFFI.xcframework
        embed: false
      # SQLCipher (inside LimeCore) uses Apple's CommonCrypto and the Security framework.
      - sdk: Security.framework
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.famkind.lime   # placeholder; confirm before registering with Apple
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lime
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Lime saves a photo to your library only when you ask it to."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lime uses the microphone to record voice messages and the sound of videos you record."
        # A call keeps its audio going when the screen locks or Lime is in the background.
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSCameraUsageDescription: "Lime uses the camera to scan a teacher's QR code and to take photos and videos to send."
      configs:
        # LIME-103 (the Bluetooth field test): Bluetooth and its background modes exist in Debug builds only.
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
          INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Lime uses Bluetooth to pass messages between nearby teachers when there's no internet."
  LimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LimeTests
    dependencies:
      - target: Lime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.famkind.lime.tests
        GENERATE_INFOPLIST_FILE: YES
  LimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LimeUITests
    dependencies:
      - target: Lime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.famkind.lime.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lime:
    build:
      targets:
        Lime: all
    test:
      targets:
        - LimeTests
        - LimeUITests
